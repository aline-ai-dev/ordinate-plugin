name: release

# A v* tag builds the OpenAI plugin ZIP and attaches it to a GitHub release.
# Uploading it to the OpenAI portal stays a manual step.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci --prefix scripts
      - run: npm i -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: node scripts/check-package.mjs
      - name: Tag matches plugin version
        run: |
          version="$(node -p 'require("./plugin.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin.json version $version" >&2
            exit 1
          fi
      - id: zip
        run: echo "path=$(bash scripts/build-zip.sh)" >> "$GITHUB_OUTPUT"
      - run: gh release create "$GITHUB_REF_NAME" "${{ steps.zip.outputs.path }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
